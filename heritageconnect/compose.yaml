# HeritageConnect - local containerised deployment
#
# Services:  nginx (reverse proxy)  -> web (Gunicorn + Django)  -> db (PostGIS)
#            pgadmin (PgAdmin4 database admin)
# Network:   heritage_net - isolated bridge network on a custom subnet
# Volumes:   postgis_data, pgadmin_data - data survives restarts
#            static_data - collected static files shared web -> nginx
#
# Public ports on the host: 8000 (Nginx) and 5050 (PgAdmin) only.
#
# All settings come from the .env file (see .env.example).

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: heritage_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    # No "ports:" here on purpose - the database is only reachable
    # by other containers on heritage_net, not from outside Docker.
    networks:
      heritage_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: heritage_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      heritage_net:
        ipv4_address: 172.28.0.20
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    container_name: heritage_web
    restart: unless-stopped
    # Start-up (migrate, collectstatic, gunicorn) is handled by
    # docker/entrypoint.sh - see the Dockerfile ENTRYPOINT.
    volumes:
      # Source code mounted for development (edits apply without rebuild)
      - .:/app
      # Collected static files, shared with Nginx
      - static_data:/app/staticfiles
    # Gunicorn is NOT published to the host - only Nginx can reach it.
    expose:
      - "8000"
    environment:
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    networks:
      heritage_net:
        ipv4_address: 172.28.0.30
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/heritage/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: heritage_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Project static files (served first, read-only)
      - ./static:/srv/src/static:ro
      # Collected static files from the web container (admin, DRF, etc.)
      - static_data:/srv/collected/static:ro
    networks:
      heritage_net:
        ipv4_address: 172.28.0.40
    depends_on:
      web:
        condition: service_healthy

networks:
  heritage_net:
    name: heritage_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  postgis_data:
  pgadmin_data:
  static_data:
