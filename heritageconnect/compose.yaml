# HeritageConnect - local containerised deployment
#
# Services:  db (PostGIS) | pgadmin (PgAdmin4) | web (Django)
# Network:   heritage_net - isolated bridge network on a custom subnet
# Volumes:   postgis_data, pgadmin_data - data survives restarts
#
# All settings come from the .env file (see .env.example).

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: heritage_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    # No "ports:" here on purpose - the database is only reachable
    # by other containers on heritage_net, not from outside Docker.
    networks:
      heritage_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: heritage_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      heritage_net:
        ipv4_address: 172.28.0.20
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    container_name: heritage_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG}
    networks:
      heritage_net:
        ipv4_address: 172.28.0.30
    depends_on:
      db:
        condition: service_healthy

networks:
  heritage_net:
    name: heritage_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  postgis_data:
  pgadmin_data:
