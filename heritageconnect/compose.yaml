# Local stack: Nginx, Django, PostGIS and PgAdmin.
services:
  db:
    image: postgis/postgis:16-3.4

    platform: linux/amd64
    container_name: heritage_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql/data

    networks:
      heritage_net:
        ipv4_address: 172.28.0.10
    # Check the database is ready before starting Django.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: heritage_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      heritage_net:
        ipv4_address: 172.28.0.20
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    container_name: heritage_web
    restart: unless-stopped

    volumes:

      - static_data:/app/staticfiles

    expose:
      - "8000"
    environment:
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-False}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-HeritageDemo2026!}
    networks:
      heritage_net:
        ipv4_address: 172.28.0.30
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/heritage/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: heritage_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      - static_data:/srv/collected/static:ro
    networks:
      heritage_net:
        ipv4_address: 172.28.0.40
    depends_on:
      web:
        condition: service_healthy

# Give the containers their own network and subnet.
networks:
  heritage_net:
    name: heritage_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

# Named volumes keep data when containers are stopped.
volumes:
  postgis_data:
  pgadmin_data:
  static_data:
