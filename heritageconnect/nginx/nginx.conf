# HeritageConnect - Nginx reverse proxy
#
# - Public entry point for the application (port 80 inside the container,
#   published as http://localhost:8000 on the host).
# - Serves collected static files (CSS/JS/images) directly.
# - Forwards all other requests to Gunicorn/Django on the "web" service.
# - Adds security headers to every response.

upstream django_app {
    # "web" is resolved by Docker's DNS on the heritage_net network.
    server web:8000;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Hide the Nginx version number in headers and error pages.
    server_tokens off;

    # Limit request body size (artisan forms are small).
    client_max_body_size 5M;

    # --- Security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The map uses the browser location for "Search Nearby" / "Find Nearest".
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # --- Compression ------------------------------------------------------
    gzip on;
    gzip_types text/css application/javascript application/json
               application/geo+json image/svg+xml;
    gzip_min_length 1024;

    # --- Static files -----------------------------------------------------
    # Production: files gathered by "collectstatic" in the web container,
    #             shared through the static_data volume (@collected_static).
    # Development (compose.dev.yaml): the project's static/ folder is also
    #             mounted at /srv/src, so CSS/JS edits show immediately.
    location /static/ {
        root /srv/src;
        try_files $uri @collected_static;
        # "no-cache" = browser re-checks with the server (cheap 304 reply),
        # so updated files are never stuck in the browser cache.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location @collected_static {
        root /srv/collected;
        # File names are not versioned, so let browsers re-check
        # (cheap 304 reply) instead of keeping an old copy for days.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # --- Everything else goes to Django -----------------------------------
    location / {
        proxy_pass http://django_app;

        # Django also sends these headers; hide its copies so each
        # header appears once (Nginx's versions above are used).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        # Keep the original host *and port* so Django's CSRF and
        # ALLOWED_HOSTS checks see "localhost:8000".
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
