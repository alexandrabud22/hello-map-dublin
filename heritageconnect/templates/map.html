{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cities Web Map - Advanced Web Mapping</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/styles.css' %}"
    >
</head>

<body>

    <!-- Main map -->
    <div id="map"></div>

    <!-- Search panel -->
    <div class="control-panel">

        <h2>Cities Web Map</h2>

        <p class="panel-description">
            Search for a city or country.
        </p>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search cities..."
        >

        <button
            id="resetBtn"
            class="reset-button"
        >
            Reset View
        </button>

        <div id="results"></div>

    </div>

    <!-- Map information -->
    <div class="info-box">

        <h4>Map Information</h4>

        <p>
            Cities loaded:
            <strong id="cityCount">0</strong>
        </p>

        <p>
            Click a marker to view city details.
        </p>

    </div>

    <!-- Loading message -->
    <div
        class="loading"
        id="loading"
    >
        Loading cities data...
    </div>

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>

    <!-- Our map JavaScript -->
    <script
        src="{% static 'js/map.js' %}"
    ></script>

</body>
</html>
